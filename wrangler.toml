name = "x-manager"
main = "src/server/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "x-manager-db"
database_id = "8f527320-2ce3-4372-a904-034925e5c685"
migrations_dir = "migrations"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "d5ba3478fd38467a861f7aeca59d8254"

[vars]
AUTH_PIN = "1234"

[build]
command = "npx vite build"
